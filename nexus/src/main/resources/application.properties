spring.application.name=nexus
server.port=${SERVER_PORT:8080}

# MySQL: valor por defecto para correr desde VS Code; Docker lo sobrescribe con DB_URL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/nexus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MongoDB (Spring Boot 4 usa el prefijo spring.mongodb)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexus_audit_db}

management.endpoints.web.exposure.include=health

# JWT: secreto (minimo 32 bytes para HS256) y vida del token en milisegundos (3600000 = 1 hora)
# Valor academico por defecto: es publico porque esta en el repositorio; Docker puede sobrescribirlo con JWT_SECRET
jwt.secret=${JWT_SECRET:NEXUSMARKET-ACADEMIC-JWT-SECRET-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Administrador inicial (SUPUESTO: sin un primer administrador nadie podria incorporar vendedores, RG-09)
# Valores academicos por defecto; se pueden sobrescribir con variables de entorno
nexus.seed.admin.email=${SEED_ADMIN_EMAIL:admin@nexusmarket.com}
nexus.seed.admin.password=${SEED_ADMIN_PASSWORD:Admin12345}
nexus.seed.admin.identity-document=${SEED_ADMIN_DOCUMENT:ADMIN-0001}
nexus.seed.admin.full-name=${SEED_ADMIN_NAME:NexusMarket Administrator}
