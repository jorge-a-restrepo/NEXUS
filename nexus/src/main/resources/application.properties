spring.application.name=nexus
server.port=${SERVER_PORT:8080}

# MySQL: valor por defecto para correr desde VS Code; Docker lo sobrescribe con DB_URL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/nexus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MongoDB (Spring Boot 4 usa el prefijo spring.mongodb)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexus_audit_db}

management.endpoints.web.exposure.include=health